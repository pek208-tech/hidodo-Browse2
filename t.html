<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experience POPUP</title>

    <script src="./js/playing-experience.js"></script>
    <style>
        .open-button {
            padding: 10px 18px;
            cursor: pointer;
        }

        .experience-modal {
            display: none;

            position: fixed;
            inset: 0;
            z-index: 9999;

            align-items: center;
            justify-content: center;

            padding: 24px;
            box-sizing: border-box;

            background: rgba(0, 0, 0, 0.75);
        }

        .experience-modal.open {
            display: flex;
        }

        .experience-dialog {
            position: relative;

            width: min(1280px, 100%);
            aspect-ratio: 16 / 9;

            background: #000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .experience-container {
            width: 100%;
            height: 100%;
        }

        .experience-frame {
            display: block;

            width: 100%;
            height: 100%;

            border: 0;
        }

        .close-button {
            position: absolute;
            top: -42px;
            right: 0;

            padding: 8px 14px;

            border: 0;
            border-radius: 4px;

            background: #fff;
            color: #111;

            cursor: pointer;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .experience-modal {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <button
        type="button"
        class="open-button"
        data-url="https://experience.dodonfriends.com/homebaking/"
        onclick="openExperience(this.dataset.url)"
    >
        홈베이킹 열기
    </button>
        <button
        type="button"
        class="open-button"
        data-url="https://experience.dodonfriends.com/paint/"
        onclick="openExperience(this.dataset.url)"
    >
        페인트 열기
    </button>


    <div
        id="experience-modal"
        class="experience-modal"
        onclick="handleBackdropClick(event)"
    >
        <div class="experience-dialog">

            <button
                type="button"
                class="close-button"
                onclick="closeExperience()"
            >
                닫기
            </button>

            <div
                id="experience-container"
                class="experience-container"
            ></div>

        </div>
    </div>
</body>
</html>
